tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
          -
            handle: handle
            field:
              generate: true
              type: slug
              instructions: 'Public author URL, for example /authors/alex-river.'
              listable: hidden
              display: Handle
          -
            handle: email
            field:
              type: text
              input: email
              display: 'Email Address'
          -
            handle: roles
            field:
              type: user_roles
              width: 50
          -
            handle: groups
            field:
              type: user_groups
              width: 50
          -
            handle: avatar
            field:
              type: assets
              max_files: 1
              container: assets
          -
            handle: bio
            field:
              type: textarea
              display: Biography
          -
            handle: website
            field:
              type: text
              display: Website
              input_type: url
              validate:
                - nullable
                - url
          -
            handle: contributor
            field:
              type: toggle
              display: 'Show on About page'
              default: false
