<footer class="mx-auto max-w-7xl px-5 pb-8 pt-12 sm:px-10">
    <div class="creek-rule" aria-hidden="true"></div>
    <div class="flex flex-wrap items-start justify-between gap-8 py-8">
        <div><p class="font-display text-3xl casual:uppercase formal:text-xl formal:font-semibold">{{ settings:site_name }}</p><p class="mt-1 max-w-[40ch] text-base text-gray-600 sm:text-sm dark:text-gray-400">{{ partial:personality_string key="footer_description" }}</p></div>
        <nav aria-label="Footer navigation" class="flex flex-wrap gap-x-6 gap-y-2 text-base sm:text-sm">{{ nav:main }}<a class="py-3 hover:text-accent" href="{{ url }}">{{ title }}</a>{{ /nav:main }}</nav>
        <div class="flex gap-1">{{ settings:social }}<a href="{{ url }}" aria-label="{{ name }}" class="flex size-12 items-center justify-center text-gray-600 hover:text-accent dark:text-gray-300">{{ svg :src="icon" class="size-5" aria-hidden="true" }}</a>{{ /settings:social }}</div>
    </div>
    <p class="text-base text-gray-600 sm:text-sm dark:text-gray-400">© {{ now format="Y" }} {{ settings:site_name }} · Powered by <a href="https://statamic.com?ref=starters-creek" class="underline">Statamic</a></p>
</footer>
