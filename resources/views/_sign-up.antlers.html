{{ if settings:show_signup && settings:signup_url }}
<aside class="mt-16 border-y border-current/20 py-10">
    <h2 class="font-display text-4xl casual:uppercase formal:text-2xl formal:font-semibold">{{ partial:personality_string key="newsletter_heading" }}</h2>
    <p class="mt-4 max-w-[48ch] text-lg text-gray-600 dark:text-gray-300">{{ settings:signup_description ?? 'New articles and things worth your time, delivered occasionally.' }}</p>
    <a href="{{ settings:signup_url }}" class="mt-6 inline-flex min-h-12 items-center gap-4 rounded-sm bg-ink px-4 py-3 text-white dark:bg-gray-100 dark:text-ink">Subscribe <span aria-hidden="true">↗</span></a>
</aside>
{{ /if }}
