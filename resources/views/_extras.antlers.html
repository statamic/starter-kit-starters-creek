{{# This SVG filter is used to "squigglify" HTML elements with the creek-rule utility #}}
<svg aria-hidden="true" focusable="false" height="0" width="0">
    <defs>
        <filter id="squiggle">
            <feTurbulence type="fractalNoise" id="turbulence" baseFrequency=".05" numOctaves="4"/>
            <feDisplacementMap id="displacement" in="SourceGraphic" scale="4" />
        </filter>
    </defs>
</svg>
